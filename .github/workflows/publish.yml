name: Publish

# Publishes the package to npm when a v* tag is pushed. Authenticates through
# npm trusted publishing (OIDC), so no token is stored; the trusted publisher
# for this repository and workflow file must be configured on npmjs.com first.
# A tag for a version that is already on the registry is a no-op, so tagging a
# release that was published by hand does not fail the run.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Run checks
        run: scripts/check.sh
      - name: Verify the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Skip a version that is already on npm
        id: registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published != 'true'
        run: npm publish --provenance --access public
